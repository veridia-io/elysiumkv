name: CodeQL

# **Advanced setup, because the engine is compiled.** CodeQL has to observe a real compilation to
# see C++ at all, and default setup can only reach compiled languages through autobuild — which
# cannot drive this project: it needs a pinned CMake, a bootstrapped vcpkg and a toolchain file
# before a single file compiles. Here the build is explicit, so what CodeQL analyzes is the same
# code CI builds.
#
# Default setup and this workflow are mutually exclusive. Switch the repository to Advanced under
# Settings -> Code security -> Code scanning, or the uploads from here are rejected.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. A scan is worth running against upstream query updates, not only against our changes.
    - cron: '0 4 * * 1'

env:
  VCPKG_DISABLE_METRICS: '1'

jobs:
  analyze:
    name: analyze / ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      # Writing results to the Security tab is the whole point; everything else stays read-only.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, java-kotlin, python]

    steps:
      - uses: actions/checkout@v7

      # Must come before the build: CodeQL instruments the compiler, so anything compiled earlier is
      # invisible to it.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # --- C++ ----------------------------------------------------------------------------------
      - name: Install build tools
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          CMAKE_DIR=cmake-4.4.0-linux-x86_64
          curl -fsSL --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v4.4.0/${CMAKE_DIR}.tar.gz" \
            | sudo tar xz -C /opt
          echo "/opt/${CMAKE_DIR}/bin" >> "$GITHUB_PATH"

      # Derived from vcpkg.json rather than written here, as in the other workflows. Also decides
      # the scan scope, because the cache key below is an expression and needs it beforehand.
      - name: Resolve the vcpkg pin and scan scope
        if: matrix.language == 'c-cpp'
        run: |
          BASELINE=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          echo "VCPKG_COMMIT=$BASELINE" >> "$GITHUB_ENV"
          echo "vcpkg pinned to $BASELINE"

          # The S3 and DynamoDB implementations are the most security-relevant code in the
          # repository — they parse remote responses and carry credentials — so they are worth
          # scanning. Building the AWS SDK costs far more than the engine does, so they go in the
          # weekly run rather than on every push and pull request.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "SCAN_AWS=ON" >> "$GITHUB_ENV"
          else
            echo "SCAN_AWS=OFF" >> "$GITHUB_ENV"
          fi

      # **Third-party binaries only.** This caches what vcpkg built for zstd, lz4 and — on the
      # weekly run — the AWS SDK. It never caches our objects, so every file of ours still compiles
      # under CodeQL's tracer; without it the weekly AWS scan would rebuild the SDK from source
      # every time. The scope is part of the key because the two feature sets install different
      # binaries.
      - name: Cache vcpkg binary archives
        if: matrix.language == 'c-cpp'
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-codeql-aws${{ env.SCAN_AWS }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-codeql-aws${{ env.SCAN_AWS }}-${{ env.VCPKG_COMMIT }}-

      - name: Set up vcpkg
        if: matrix.language == 'c-cpp'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$VCPKG_COMMIT"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      # A JDK is needed even for the C++ language: CMake builds the JNI glue only when it finds one,
      # and that glue is C++ worth analyzing.
      - uses: actions/setup-java@v5
        if: matrix.language == 'c-cpp'
        with:
          distribution: temurin
          java-version: '11'

      # Our own objects are never cached, deliberately: a cache hit would skip compilation and
      # CodeQL would analyze nothing while still reporting success. `release` rather than a
      # sanitizer preset — sanitizers instrument the runtime, which does nothing for static
      # analyzis and only slows the build.
      - name: Build the engine
        if: matrix.language == 'c-cpp'
        run: |
          echo "ELYSIUMKV_BUILD_AWS=$SCAN_AWS"
          cmake --preset release -DELYSIUMKV_BUILD_AWS="$SCAN_AWS"
          cmake --build --preset release

      # --- Java ---------------------------------------------------------------------------------
      - uses: actions/setup-java@v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # -DskipTests because the suite needs the native library, which this job does not build; the
      # binding's own sources compile without it (maven-resources skips the absent native directory).
      - name: Build the binding
        if: matrix.language == 'java-kotlin'
        run: mvn -B -f bindings/java/pom.xml package -DskipTests

      # --- analyzis -----------------------------------------------------------------------------
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
