name: CodeQL

# **Advanced setup, because the engine is compiled.** GitHub's default setup can only analyze
# languages that need no build, which is why it found `bench/check_regression.py` and nothing else —
# the C++ that is the entire product went unanalysed. CodeQL has to observe a real compilation to
# see C++ at all, and autobuild cannot drive this project: it needs a pinned CMake, a bootstrapped
# vcpkg and a toolchain file before a single file compiles.
#
# Default setup and this workflow are mutually exclusive. Switch the repository to Advanced under
# Settings -> Code security -> Code scanning, or the uploads from here are rejected.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. A scan is worth running against upstream query updates, not only against our changes.
    - cron: '0 4 * * 1'

env:
  VCPKG_DISABLE_METRICS: '1'

jobs:
  analyze:
    name: analyze / ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      # Writing results to the Security tab is the whole point; everything else stays read-only.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, java-kotlin, python]

    steps:
      - uses: actions/checkout@v7

      # Must come before the build: CodeQL instruments the compiler, so anything compiled earlier is
      # invisible to it.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # --- C++ ----------------------------------------------------------------------------------
      - name: Install build tools
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          CMAKE_DIR=cmake-4.4.0-linux-x86_64
          curl -fsSL --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v4.4.0/${CMAKE_DIR}.tar.gz" \
            | sudo tar xz -C /opt
          echo "/opt/${CMAKE_DIR}/bin" >> "$GITHUB_PATH"

      # Derived from vcpkg.json rather than written here, as in the other workflows.
      - name: Resolve the vcpkg pin
        if: matrix.language == 'c-cpp'
        run: |
          BASELINE=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          echo "VCPKG_COMMIT=$BASELINE" >> "$GITHUB_ENV"
          echo "vcpkg pinned to $BASELINE"

      - name: Set up vcpkg
        if: matrix.language == 'c-cpp'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$VCPKG_COMMIT"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      # A JDK is needed even for the C++ language: CMake builds the JNI glue only when it finds one,
      # and that glue is C++ worth analysing.
      - uses: actions/setup-java@v4
        if: matrix.language == 'c-cpp'
        with:
          distribution: temurin
          java-version: '11'

      # No build cache, deliberately: a cache hit would skip compilation, and CodeQL would then see
      # nothing. `release` rather than a sanitizer preset — the sanitizers instrument the runtime,
      # which does nothing for static analysis and only slows the build.
      - name: Build the engine
        if: matrix.language == 'c-cpp'
        run: |
          cmake --preset release
          cmake --build --preset release

      # --- Java ---------------------------------------------------------------------------------
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # -DskipTests because the suite needs the native library, which this job does not build; the
      # binding's own sources compile without it (maven-resources skips the absent native directory).
      - name: Build the binding
        if: matrix.language == 'java-kotlin'
        run: mvn -B -f bindings/java/pom.xml package -DskipTests

      # --- analysis -----------------------------------------------------------------------------
      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
