name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

env:
  VCPKG_DISABLE_METRICS: '1'

jobs:
  # A minute of gcc before the matrix spends twenty. Development happens on macOS/clang and CI runs
  # Linux/gcc, and the two disagree in ways that only surface after a push: libstdc++ does not
  # provide the transitive includes libc++ does, gcc's -Wdangling-else fires where clang's does not,
  # and -Wconversion differs in coverage. Each of those has broken this build at least once.
  #
  # Syntax-only, so it needs headers and no libraries, and it fails with the same message the matrix
  # would have produced half an hour later.
  toolchain-check:
    name: gcc / warnings and includes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Headers only, and **the runner's default compiler** — deliberately not a pinned newer one.
      # The build matrix uses whatever `/usr/bin/c++` is, so a check that pinned something else
      # would be verifying a compiler nothing else uses, which is the failure this job exists to
      # prevent rather than to repeat.
      - name: Install headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtest-dev libgmock-dev libzstd-dev liblz4-dev

      # Every header alone: catches an include a header relies on getting transitively.
      - name: Headers compile standalone
        run: tools/check-headers.sh

      # Every translation unit with the project's warning set: catches what -Werror would.
      - name: Sources compile under the full warning set
        run: tools/check-gcc.sh

  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both architectures, not just both operating systems. The engine has
        # arch-dependent code — CRC32 dispatches on SSE4.2 or on the ARMv8 CRC
        # extension — and the two differ in what the compiler may assume: x86-64
        # guarantees the baseline and probes for SSE4.2, while CRC32 is optional
        # in ARMv8-A and only mandatory from ARMv8.1-A. A matrix covering one
        # arch can silently fall back to the software path on the other.
        #
        # ubuntu-latest is x86-64 and macos-latest is arm64, so those two cover
        # both arches; ubuntu-24.04-arm covers arm64 under gcc, which is the
        # combination with no other home and the one that caught this.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        preset: [debug, release, asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          # vcpkg's port scripts use string(JSON ... STRING_ENCODE), which is a
          # CMake 4 feature, and vcpkg reaches for a *system* cmake whenever one
          # clears its own minimum instead of fetching the version its ports
          # were written against. The runner images ship 3.31, which clears that
          # minimum and lacks the feature, so building any port from source dies
          # in vcpkg's own scripts. (It only shows up on a binary-cache miss,
          # which is why arm64 hit it first.) Installing 4.x ahead of the system
          # copy fixes it and makes the toolchain identical across the matrix.
          CMAKE_VERSION=4.4.0
          case "${RUNNER_ARCH}" in
            X64)   CMAKE_ARCH=x86_64 ;;
            ARM64) CMAKE_ARCH=aarch64 ;;
            *) echo "unhandled runner arch ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          CMAKE_DIR="cmake-${CMAKE_VERSION}-linux-${CMAKE_ARCH}"
          curl -fsSL --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${CMAKE_DIR}.tar.gz" \
            | sudo tar xz -C /opt
          echo "/opt/${CMAKE_DIR}/bin" >> "$GITHUB_PATH"

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # **Derived, never written down here.** `vcpkg.json`'s `builtin-baseline` already pins the
      # port versions, and the checked-out revision has to agree with it. Two files holding one
      # hash is a bug generator. Must precede the cache step: that step's key is an expression,
      # evaluated before it runs, so the value has to be in the environment by then.
      - name: Resolve the vcpkg pin
        run: |
          BASELINE=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          echo "VCPKG_COMMIT=$BASELINE" >> "$GITHUB_ENV"
          echo "vcpkg pinned to $BASELINE"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$VCPKG_COMMIT"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Sanitizers are a build gate, not an option (ARCHITECTURE.md "Invariants and sanitizers").
      #
      # detect_leaks is Linux-only: LeakSanitizer is not implemented on macOS,
      # and asking for it there is a startup error, not a no-op. Leak coverage
      # therefore comes from the Linux legs of this matrix — which is enough,
      # since a leak is a property of the code and not of the platform.
      # `--parallel`, because `gtest_discover_tests` makes one ctest test per gtest case:
      # 412 separate processes, each paying a sanitizer runtime's startup, run one at a time
      # on a four-core runner. `getconf` rather than `nproc` so the macOS legs work too.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel "$(getconf _NPROCESSORS_ONLN)"
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: ${{ runner.os == 'Linux' && 'detect_leaks=1:abort_on_error=1' || 'abort_on_error=1' }}
          TSAN_OPTIONS: halt_on_error=1


  # ARCHITECTURE.md "Dependencies and artifacts" step 10 — the Java binding. Its native half is built by CMake, so this
  # needs the same toolchain as the engine legs; only the test runner differs.
  java:
    name: java ${{ matrix.jdk }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # JDK 11 is the declared floor (ARCHITECTURE.md "The ABI boundary" chose JNI over Panama FFM precisely
        # for that reach), so it runs everywhere the native artifact is built.
        # One JDK 25 leg covers JEP 472: from JDK 24 a JNI load without
        # --enable-native-access warns on every startup, and older JVMs refuse
        # the flag outright, so both ends of that range need exercising.
        include:
          - {os: ubuntu-latest,    jdk: '11'}
          - {os: ubuntu-24.04-arm, jdk: '11'}
          - {os: macos-latest,     jdk: '11'}
          - {os: ubuntu-latest,    jdk: '25'}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          # vcpkg's port scripts use string(JSON ... STRING_ENCODE), which is a
          # CMake 4 feature, and vcpkg reaches for a *system* cmake whenever one
          # clears its own minimum instead of fetching the version its ports
          # were written against. The runner images ship 3.31, which clears that
          # minimum and lacks the feature, so building any port from source dies
          # in vcpkg's own scripts. (It only shows up on a binary-cache miss,
          # which is why arm64 hit it first.) Installing 4.x ahead of the system
          # copy fixes it and makes the toolchain identical across the matrix.
          CMAKE_VERSION=4.4.0
          case "${RUNNER_ARCH}" in
            X64)   CMAKE_ARCH=x86_64 ;;
            ARM64) CMAKE_ARCH=aarch64 ;;
            *) echo "unhandled runner arch ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          CMAKE_DIR="cmake-${CMAKE_VERSION}-linux-${CMAKE_ARCH}"
          curl -fsSL --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${CMAKE_DIR}.tar.gz" \
            | sudo tar xz -C /opt
          echo "/opt/${CMAKE_DIR}/bin" >> "$GITHUB_PATH"

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # **Derived, never written down here.** `vcpkg.json`'s `builtin-baseline` already pins the
      # port versions, and the checked-out revision has to agree with it. Two files holding one
      # hash is a bug generator. Must precede the cache step: that step's key is an expression,
      # evaluated before it runs, so the value has to be in the environment by then.
      - name: Resolve the vcpkg pin
        run: |
          BASELINE=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          echo "VCPKG_COMMIT=$BASELINE" >> "$GITHUB_ENV"
          echo "vcpkg pinned to $BASELINE"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$VCPKG_COMMIT"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      # The glue links the static archive, so the engine has to build first.
      - name: Build the native library
        run: |
          cmake --preset release
          cmake --build --preset release --target elysiumkv_jni

      - name: Test the binding
        run: mvn -B -f bindings/java verify -Delysiumkv.native.dir=$GITHUB_WORKSPACE/build/release

      # The suite above already exercises extraction — it runs without
      # -Delysiumkv.library.path, so NativeLibrary pulls the artifact out of
      # target/classes exactly as it would out of a jar. What it cannot prove is
      # that the artifact was *packaged*: a resources misconfiguration would
      # leave a jar that works on the build machine and nowhere else.
      - name: Check the jar carries a native library for this platform
        run: |
          # Select the main jar explicitly. `elysiumkv-*.jar` used to match one file; since the pom
          # attaches sources and javadoc jars for Maven Central it matches three, and `jar t` treats
          # arguments after the first as *entry names to look up inside it* — so the glob silently
          # listed nothing and this check failed on every run.
          JARS=$(ls bindings/java/target/*.jar 2>/dev/null | grep -vE -- '-(sources|javadoc)\.jar$' || true)
          COUNT=$(printf '%s' "$JARS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "expected exactly one main jar, found $COUNT:" >&2; echo "$JARS" >&2; exit 1
          fi
          jar tf "$JARS" | grep -E 'native/.*/libelysiumkv_jni' \
            || { echo "the jar has no native library for this platform" >&2; exit 1; }

  # ARCHITECTURE.md "The ABI boundary", ARCHITECTURE.md "Ownership is one compare-and-set" — the remote implementations, against LocalStack. One job, on
  # x86 Linux only: this is about the S3 and DynamoDB code paths, not about
  # architecture, and it is the heaviest configuration in the matrix because
  # aws-sdk-cpp has to be built.
  #
  # LocalStack is pinned to 4.4.0 deliberately. `latest` refuses to start without
  # a licence key, and 3.8 silently ignores `If-Match` — under 3.8 the write-once
  # tests pass while a stale-token compare-and-swap *succeeds*, so the suite would
  # show the fence working while two writers both install.
  remote:
    name: remote storage / localstack
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.4.0
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb
        options: >-
          --health-cmd "curl -fs http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          CMAKE_VERSION=4.4.0
          CMAKE_DIR="cmake-${CMAKE_VERSION}-linux-x86_64"
          curl -fsSL --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${CMAKE_DIR}.tar.gz" \
            | sudo tar xz -C /opt
          echo "/opt/${CMAKE_DIR}/bin" >> "$GITHUB_PATH"

      # **Derived, never written down here.** `vcpkg.json`'s `builtin-baseline` already pins the
      # port versions, and the checked-out revision has to agree with it. Two files holding one
      # hash is a bug generator. Must precede the cache step: that step's key is an expression,
      # evaluated before it runs, so the value has to be in the environment by then.
      - name: Resolve the vcpkg pin
        run: |
          BASELINE=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          echo "VCPKG_COMMIT=$BASELINE" >> "$GITHUB_ENV"
          echo "vcpkg pinned to $BASELINE"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-aws-ubuntu-latest-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-aws-ubuntu-latest-${{ env.VCPKG_COMMIT }}-

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$VCPKG_COMMIT"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with the remote implementations
        run: |
          cmake -S . -B build/aws -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DELYSIUMKV_BUILD_AWS=ON -DELYSIUMKV_PARANOID=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build/aws

      - name: Provision the bucket
        # S3BlobStore has no create-bucket option on purpose: a bucket is
        # provisioned infrastructure, and creating one silently would hide a
        # misconfigured name behind a working store. The DynamoDB table needs no
        # equivalent — createTableIfMissing is a real option there.
        #
        # Uses the AWS CLI v2 that the runner image already ships, rather than
        # `pip install awscli-local awscli`. That installed two *unpinned*
        # packages to run one command, and awscli v1 bundles an s3transfer that
        # imports `botocore.vendored` — which botocore has since removed. So the
        # step broke on a day when nothing in this repository had changed, which
        # is the failure mode of depending on unpinned transitive versions for
        # something the environment already provides. A preinstalled tool cannot
        # drift out from under the workflow.
        #
        # head-bucket is not redundant: it asserts the bucket exists under the
        # name the tests actually use. Without it a provisioning mistake surfaces
        # much later as remote cases that skip or fail for an unrelated-looking
        # reason.
        run: |
          aws --endpoint-url "$AWS_ENDPOINT" s3api create-bucket --bucket elysiumkv
          aws --endpoint-url "$AWS_ENDPOINT" s3api head-bucket --bucket elysiumkv
        env:
          AWS_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      # The contract suites, instantiated for S3 and DynamoDB, plus the smoke
      # probes. Without ELYSIUMKV_S3_ENDPOINT every remote case *skips*, so the
      # variable is what makes this job mean anything.
      - name: Test the remote implementations
        run: ctest --test-dir build/aws --output-on-failure
        env:
          ELYSIUMKV_S3_ENDPOINT: http://localhost:4566
          AWS_EC2_METADATA_DISABLED: 'true'

      # The Java suite starts its *own* LocalStack through Testcontainers rather
      # than using the service above, because it needs the container handle to
      # provision the bucket and to map a port it did not choose. Each layer uses
      # the mechanism it can: ctest takes an endpoint from the environment,
      # Testcontainers manages a lifecycle.
      #
      # -Delysiumkv.remote.required=true turns the Java suite's skips into failures:
      # a skipped remote test on the one runner that has Docker is
      # indistinguishable from a pass.
      - name: Test the binding against remote storage
        run: |
          cmake --build build/aws --target elysiumkv_jni
          mvn -B -f bindings/java verify \
            -Delysiumkv.native.dir=$GITHUB_WORKSPACE/build/aws \
            -Delysiumkv.remote.required=true

  # ARCHITECTURE.md "Benchmarks" — benchmarks are gating, not reported. The differential oracle
  # validates answers, not cost.
  benchmarks:
    name: benchmarks / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          # vcpkg's port scripts use string(JSON ... STRING_ENCODE), which is a
          # CMake 4 feature, and vcpkg reaches for a *system* cmake whenever one
          # clears its own minimum instead of fetching the version its ports
          # were written against. The runner images ship 3.31, which clears that
          # minimum and lacks the feature, so building any port from source dies
          # in vcpkg's own scripts. (It only shows up on a binary-cache miss,
          # which is why arm64 hit it first.) Installing 4.x ahead of the system
          # copy fixes it and makes the toolchain identical across the matrix.
          CMAKE_VERSION=4.4.0
          case "${RUNNER_ARCH}" in
            X64)   CMAKE_ARCH=x86_64 ;;
            ARM64) CMAKE_ARCH=aarch64 ;;
            *) echo "unhandled runner arch ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          CMAKE_DIR="cmake-${CMAKE_VERSION}-linux-${CMAKE_ARCH}"
          curl -fsSL --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${CMAKE_DIR}.tar.gz" \
            | sudo tar xz -C /opt
          echo "/opt/${CMAKE_DIR}/bin" >> "$GITHUB_PATH"
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      # **Derived, never written down here.** `vcpkg.json`'s `builtin-baseline` already pins the
      # port versions, and the checked-out revision has to agree with it. Two files holding one
      # hash is a bug generator. Must precede the cache step: that step's key is an expression,
      # evaluated before it runs, so the value has to be in the environment by then.
      - name: Resolve the vcpkg pin
        run: |
          BASELINE=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          echo "VCPKG_COMMIT=$BASELINE" >> "$GITHUB_ENV"
          echo "vcpkg pinned to $BASELINE"

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$VCPKG_COMMIT"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
      - run: cmake --preset release && cmake --build --preset release --target elysiumkv_bench

      # The baseline belongs to the runner, not to the repository. A committed
      # number is a measurement of whichever machine produced it, so comparing a
      # runner against it reports the hardware difference as a regression. This
      # restores the last baseline *this* OS's runners recorded on main; a PR
      # therefore gates against main's numbers, measured on the same class of
      # machine, and never writes back.
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v6
        with:
          path: bench/baselines
          key: bench-baseline-${{ matrix.os }}-
          restore-keys: bench-baseline-${{ matrix.os }}-

      - name: Run benchmarks
        # Medians over repetitions: a shared CI runner is noisy, and a 10%
        # threshold against a single sample would be a coin toss.
        #
        # Fifteen repetitions of a second each, after half a second of warmup
        # discarded. Measured locally, that puts the coefficient of variation
        # between 0.2% and 2.2% and the whole run at about two and a half
        # minutes — so the median is settled to well under a percent, against a
        # threshold of ten. The run reports its own dispersion and the ratchet
        # declines to judge a benchmark whose noise could account for the change,
        # which is what keeps a bad afternoon on a shared runner from failing a
        # build that changed nothing.
        run: |
          ./build/release/bench/elysiumkv_bench \
            --benchmark_min_time=1s \
            --benchmark_repetitions=15 \
            --benchmark_min_warmup_time=0.5 \
            --benchmark_report_aggregates_only=true \
            --benchmark_format=json > bench-results.json
      # The first run on a given OS has nothing to compare against: it writes the
      # baseline and passes. The gate is live from the second main build onward.
      #
      # ===================== TEMPORARY: THE RATCHET IS OFF =====================
      # `--update` overwrites the baseline and returns success without comparing,
      # so this step currently gates nothing. It is here because the benchmarks
      # changed shape — the prefix-scan store is no longer rebuilt inside the
      # measurement and no engine threads run during it — so every stored
      # baseline describes a different experiment and would read as a change
      # nobody made.
      #
      # **Remove `--update` once each OS in the matrix has recorded one baseline
      # on main.** That is one green push per runner; the step name says so in
      # the CI log until it happens, because a disabled gate that looks enabled
      # is the failure mode worth designing out.
      # =========================================================================
      - name: Check against baseline (RATCHET DISABLED — rebaselining)
        run: python3 bench/check_regression.py bench-results.json --update

      # Only main ratchets the stored baseline, so a slow PR cannot raise the bar
      # for the PRs behind it. The run number keeps the key unique — cache
      # entries are immutable, and restore-keys picks the newest prefix match.
      - name: Save benchmark baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: bench/baselines
          key: bench-baseline-${{ matrix.os }}-${{ github.run_number }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ matrix.os }}
          path: |
            bench-results.json
            bench/baselines/
