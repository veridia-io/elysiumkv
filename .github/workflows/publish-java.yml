name: Build and Publish Java Library

# The binding's jar carries a CMake-built native library per platform, so publishing is a
# fan-in: each platform is built on its own runner, then one job assembles a single jar holding
# all of them.
#
# **That assembly is the point.** `NativeLibrary` resolves `native/{os}-{arch}/libelysiumkv_jni.*`
# out of its own classpath, so a jar built on one runner works only on that platform — and it
# fails at *first use* with an UnsatisfiedLinkError rather than at dependency-resolution time. A
# single-platform release looks completely fine to whoever cut it.
on:
  # Only when the publishing machinery or a binding changes: this builds the native library three
  # times, and the `ci` workflow runs both bindings' test suites on every push and pull request
  # regardless of what was touched. What is exercised *here* is the packaging and release path, not
  # the code — and it runs on pull requests at all because a publish path exercised only on release
  # day breaks on release day.
  pull_request:
    paths:
      - 'bindings/java/**'
      - 'bindings/kafka-streams-v3/**'
      - '.github/workflows/publish-java.yml'
  # **published, not created.** A draft is provisional — it can be edited or deleted — and Maven
  # Central is not: a version pushed there cannot be replaced. Publishing is the point at which the
  # release stops being a draft, so it is the point at which the artifact should go out. It also
  # orders the two release workflows correctly: `release-cli` attaches its binaries to the draft on
  # `created`, and this runs afterwards, when the release is published with those assets in place.
  release:
    types: [published]

env:
  AWS_SDK_VERSION: "1.11.860"

jobs:
  # The release tag is the only place the version is written down. Both artifacts derive from it:
  # the jar through `versions:set`, the native library through `-DELYSIUMKV_VERSION`. Nothing to bump
  # in the source, and nothing that can disagree — `elysiumkv_version()` is what an operator calls to
  # find out what they are running, so it answering something other than the jar's version is the
  # failure worth designing out rather than gating on.
  version:
    name: resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Derive the version from the event
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          else
            # Not a release: a build number nobody will publish, distinguishable at a glance from
            # anything that came off a tag.
            VERSION="0.0.0-pr${{ github.event.pull_request.number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building $VERSION"

  native:
    name: native / ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `platform` must match NativeLibrary.platform() and the pom's OS profiles: it is the
        # directory name inside the jar, so a mismatch yields a jar that resolves nothing.
        include:
          - {os: ubuntu-latest,    platform: linux-x86_64,   library: libelysiumkv_jni.so}
          - {os: ubuntu-24.04-arm, platform: linux-aarch64,  library: libelysiumkv_jni.so}
          - {os: macos-latest,     platform: darwin-aarch64, library: libelysiumkv_jni.dylib}
          # Intel Macs, and not only Intel Macs: an x86_64 JDK on Apple Silicon reports
          # os.arch=x86_64 under Rosetta, so the loader asks for this key on a machine that has the
          # aarch64 library sitting in the same jar. macos-13 is the last Intel runner.
          - {os: macos-13,         platform: darwin-x86_64,  library: libelysiumkv_jni.dylib}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Same CMake pin as the ci workflow — see the comment there.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          CMAKE_VERSION=4.4.0
          case "${RUNNER_ARCH}" in
            X64)   CMAKE_ARCH=x86_64 ;;
            ARM64) CMAKE_ARCH=aarch64 ;;
            *) echo "unhandled runner arch ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          CMAKE_DIR="cmake-${CMAKE_VERSION}-linux-${CMAKE_ARCH}"
          curl -fsSL --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${CMAKE_DIR}.tar.gz" \
            | sudo tar xz -C /opt
          echo "/opt/${CMAKE_DIR}/bin" >> "$GITHUB_PATH"

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # **Derived, never written down here.** `vcpkg.json`'s `builtin-baseline` already pins the
      # port versions, and the checked-out revision has to agree with it — the baseline may not
      # even be resolvable from a different one. Two files holding one hash is a bug generator:
      # the first draft of this workflow carried a hash that matched nothing.
      - name: Resolve the vcpkg pin
        run: |
          BASELINE=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          echo "VCPKG_COMMIT=$BASELINE" >> "$GITHUB_ENV"
          echo "vcpkg pinned to $BASELINE"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          # `aws` is in the key because the published library is built with the SDK, and
          # vcpkg.json does not change when that is switched on — the feature is selected by a
          # CMake option. Without it a hit on a pre-AWS cache would restore an archive missing
          # aws-sdk-cpp, rebuild it, and then not save it, since actions/cache only writes on a
          # miss. Every release would pay the full SDK build.
          key: vcpkg-aws-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-aws-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$VCPKG_COMMIT"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      # CMake builds the glue only when it finds a JDK, so this comes before configuring.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # The glue links the static archive, so the engine builds first.
      #
      # **Built with the remote implementations.** The jar is the only artifact most consumers
      # ever see, so a jar without S3 makes remote tiers unreachable for everyone who does not
      # build from source — and the failure is a configuration error at the first call, long after
      # the choice was made. The SDK is the heaviest thing in this build, which is why it stays off
      # by default for development and for the four-preset matrix; a release is the one place worth
      # paying it. Verified not to widen the export surface: the glue still exports two symbols and
      # the C ABI only its own, so nothing of the SDK, curl or OpenSSL is interposed on a host
      # process that has its own.
      - name: Build the native library
        run: |
          cmake --preset release -DELYSIUMKV_BUILD_AWS=ON -DELYSIUMKV_VERSION="$ELYSIUMKV_VERSION"
          # A stale CMakeCache would silently keep an older value, and the generated header is the
          # only place the result is observable before the library is in someone's hands.
          grep -F "\"$ELYSIUMKV_VERSION\"" build/release/generated/elysiumkv/elysiumkv_version.hpp \
            || { echo "the build is not reporting $ELYSIUMKV_VERSION" >&2; exit 1; }
          cmake --build --preset release --target elysiumkv_jni
        env:
          ELYSIUMKV_VERSION: ${{ needs.version.outputs.version }}

      # The musl job cannot use vcpkg — its lz4 port does not build under musl — so it pins the AWS
      # SDK by hand. Two pins for one release is a version skew waiting to happen, and it would be
      # invisible: the artifacts differ only in the SDK's own behaviour, on the half of consumers
      # running the other libc. Checked here, where vcpkg's answer is on disk, so drift fails the
      # release rather than shipping.
      - name: The musl pin must match what vcpkg installs
        run: |
          installed=$(sed -n '/^Package: aws-sdk-cpp$/,/^$/p' \
              build/release/vcpkg_installed/vcpkg/status | sed -n 's/^Version: //p' | head -1)
          [ -n "$installed" ] || { echo "could not read vcpkg's aws-sdk-cpp version" >&2; exit 1; }
          [ "$installed" = "$AWS_SDK_VERSION" ] || {
            echo "vcpkg installs aws-sdk-cpp $installed but the musl job pins $AWS_SDK_VERSION;" >&2
            echo "update AWS_SDK_VERSION so both libcs ship the same SDK" >&2
            exit 1
          }
          echo "both libcs will ship aws-sdk-cpp $installed"

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: build/release/${{ matrix.library }}
          if-no-files-found: error
          retention-days: 1

  # A separate job rather than a matrix entry, because almost nothing is shared: apk instead of apt,
  # no vcpkg, and the AWS SDK built from source. Alpine packages the SDK, but not usably — 1.11.205
  # has no PutObjectRequest::SetIfNoneMatch, which is the conditional write the S3 manifest's
  # compare-and-set is, and it is built with AWS memory management on so `Aws::String` is not
  # `std::string` and none of aws/ compiles against it. vcpkg is not the answer either: its lz4 port
  # fails to build under musl.
  #
  # The engine itself needed nothing — it compiles clean against musl. What the port cost was two
  # CMake changes: a pkg-config fallback for zstd and lz4, which Alpine ships without CMake configs,
  # and importing ZLIB before the SDK, whose exported targets name ZLIB::ZLIB without importing it.
  native-musl:
    name: native / ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,    platform: linux-x86_64-musl}
          - {os: ubuntu-24.04-arm, platform: linux-aarch64-musl}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pinned, and the version is load-bearing rather than "recent": conditional writes on
      # PutObject arrived after the release Alpine packages, and the manifest catalog's whole
      # correctness argument is that compare-and-set. The glibc job checks this against what vcpkg
      # actually installs, so the two libcs cannot drift onto different SDKs.
      #
      # Under the workspace so the cache action can reach it on the host and the container can see
      # it at the same path — the SDK's exported CMake configs carry their install prefix, so it has
      # to be mounted where it was built.
      - name: Cache the AWS SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: aws-sdk-install
          key: aws-sdk-musl-${{ matrix.platform }}-${{ env.AWS_SDK_VERSION }}

      # Docker rather than `container:`, which would run every step inside Alpine. The runner's
      # JavaScript actions — checkout, cache, upload-artifact — need a Node it ships as a musl build
      # for x64 only, and renaming the distribution to get past that check routes both architectures
      # to the glibc Node, which gcompat cannot carry. Keeping the actions on the host sidesteps it:
      # only the build needs musl.
      - name: Build the AWS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          cat > musl-sdk.sh <<'SCRIPT'
          set -eux
          apk add --no-cache build-base cmake ninja git curl-dev zlib-dev openssl-dev
          git clone -q --depth 1 --branch "$AWS_SDK_VERSION" --recurse-submodules \
              --shallow-submodules https://github.com/aws/aws-sdk-cpp.git /sdk
          # USE_AWS_MEMORY_MANAGEMENT=OFF is what makes Aws::String an ordinary std::string, which
          # is what the rest of this repository is written against.
          cmake -S /sdk -B /sdk/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_ONLY="s3;dynamodb;kms" -DENABLE_TESTING=OFF -DAUTORUN_UNIT_TESTS=OFF \
                -DUSE_AWS_MEMORY_MANAGEMENT=OFF -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_INSTALL_PREFIX=/work/aws-sdk-install
          cmake --build /sdk/build --target install
          SCRIPT
          docker run --rm -v "$PWD:/work" -w /work -e AWS_SDK_VERSION alpine:3.20 sh musl-sdk.sh
        env:
          AWS_SDK_VERSION: ${{ env.AWS_SDK_VERSION }}

      # The ldd check runs in the container on purpose: the host is glibc and its ldd says nothing
      # useful about a musl object. A glibc build would otherwise upload cleanly and fail inside
      # dlopen in somebody's cluster.
      - name: Build the native library
        run: |
          cat > musl-jni.sh <<'SCRIPT'
          set -eux
          apk add --no-cache build-base cmake ninja zstd-dev lz4-dev openssl-dev curl-dev \
              zlib-dev linux-headers pkgconf openjdk11
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk
          # Tests, CLI and benchmarks off: this job builds one shared object, and each of the
          # three pulls a dependency the container does not have — gtest, cli11 and friends, google
          # benchmark. Tests default to ON, so leaving them out is not the same as not needing them.
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/work/aws-sdk-install -DELYSIUMKV_BUILD_AWS=ON \
                -DELYSIUMKV_BUILD_TESTS=OFF -DELYSIUMKV_BUILD_CLI=OFF \
                -DELYSIUMKV_BUILD_BENCH=OFF \
                -DELYSIUMKV_VERSION="$ELYSIUMKV_VERSION"
          # A stale CMakeCache would silently keep an older value, and the generated header is the
          # only place the result is observable before the library is in someone's hands.
          grep -F "$ELYSIUMKV_VERSION" \
              build/release/generated/elysiumkv/elysiumkv_version.hpp
          cmake --build build/release --target elysiumkv_jni
          ldd build/release/libelysiumkv_jni.so | grep -q ld-musl
          SCRIPT
          docker run --rm -v "$PWD:/work" -w /work -e ELYSIUMKV_VERSION alpine:3.20 sh musl-jni.sh
        env:
          ELYSIUMKV_VERSION: ${{ needs.version.outputs.version }}

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: build/release/libelysiumkv_jni.so
          if-no-files-found: error
          retention-days: 1

  jar:
    name: assemble and publish
    needs: [version, native, native-musl]
    runs-on: ubuntu-latest
    permissions:
      # Read-only: publishing goes to Maven Central, not GitHub Packages, so this workflow needs no
      # write scope on the repository at all.
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # ARCHITECTURE.md "The ABI boundary" — the declared floor. Compiling the released artifact with it is what keeps the
          # bytecode from quietly requiring something newer.
          java-version: '11'
          cache: maven
          # Writes ~/.m2/settings.xml with a `central` server whose credentials are *references* to
          # these environment variables, so no secret value is ever written to the file. The id must
          # match `publishingServerId` in the pom.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_CENTRAL_GPG_PRIV_KEY }}

      - name: Collect the native libraries
        uses: actions/download-artifact@v6
        with:
          path: bindings/java/native-staging
          pattern: native-*

      # The artifact names carry the platform; the pom expects bare {os}-{arch} directories.
      - name: Arrange the staging tree
        run: |
          cd bindings/java/native-staging
          for dir in native-*; do mv "$dir" "${dir#native-}"; done
          find . -type f | sort

      # Set on pull requests too, not only releases: the same version the native libraries were
      # built with, so the PR run exercises the release path rather than a near-miss of it.
      - name: Set the version
        run: |
          mvn -B -f bindings/java/pom.xml versions:set \
            -DnewVersion="${{ needs.version.outputs.version }}" -DgenerateBackupPoms=false

      # **Gate the inputs before anything is built or signed.** The preventive half: if all three
      # platform libraries are staged under the names the pom's resource config expects, the jar
      # cannot come out short. The jar-content check below is the confirming half.
      - name: Verify every platform arrived
        run: |
          cd bindings/java/native-staging
          for entry in linux-x86_64/libelysiumkv_jni.so \
                       linux-aarch64/libelysiumkv_jni.so \
                       linux-x86_64-musl/libelysiumkv_jni.so \
                       linux-aarch64-musl/libelysiumkv_jni.so \
                       darwin-aarch64/libelysiumkv_jni.dylib \
                       darwin-x86_64/libelysiumkv_jni.dylib; do
            [ -s "$entry" ] || { echo "missing or empty: $entry" >&2; exit 1; }
          done
          echo "all six platform libraries staged"

      # Runs the test suite as part of the lifecycle, and deliberately *without*
      # -Delysiumkv.library.path: that exercises extraction against the assembled multi-platform
      # resources rather than against a build directory.
      #
      # `verify` rather than `package`, so the sources and javadoc jars Central requires are built
      # here — and signed, on a release — where a failure is a red check rather than a failed
      # publish. PR builds skip -Prelease because a fork PR has no signing key.
      - name: Build, test and sign
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            mvn -B -f bindings/java/pom.xml verify -Prelease
          else
            mvn -B -f bindings/java/pom.xml verify
          fi
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      # **A jar missing a platform is the failure this workflow exists to prevent**, and it stays
      # invisible until a consumer on that platform calls into the library. Assert every platform
      # rather than trusting the resource plumbing.
      - name: Verify the jar carries every platform
        run: |
          # Exactly one candidate, or refuse. `ls ... | head -1` picks alphabetically, which on a
          # dirty target/ means checking a *stale* jar and passing — caught while dry-running this
          # locally, where a leftover snapshot sorted ahead of the release just built. Written without
          # `mapfile` so it runs under bash 3.2 as well, which is what makes it dry-runnable on a
          # developer's Mac rather than only on a runner.
          JARS=$(ls bindings/java/target/*.jar 2>/dev/null | grep -vE -- '-(sources|javadoc)\.jar$' || true)
          COUNT=$(printf '%s' "$JARS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "expected exactly one jar, found $COUNT:" >&2; echo "$JARS" >&2; exit 1
          fi
          JAR="$JARS"
          echo "checking $JAR"
          for entry in native/linux-x86_64/libelysiumkv_jni.so \
                       native/linux-aarch64/libelysiumkv_jni.so \
                       native/linux-x86_64-musl/libelysiumkv_jni.so \
                       native/linux-aarch64-musl/libelysiumkv_jni.so \
                       native/darwin-aarch64/libelysiumkv_jni.dylib \
                       native/darwin-x86_64/libelysiumkv_jni.dylib; do
            jar tf "$JAR" | grep -qx "$entry" || { echo "missing $entry" >&2; exit 1; }
          done
          echo "all platforms present"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      # Asks the finished artifact what it is, which is the only question that covers the whole
      # chain: tag → CMake → the shared object → the jar resource → extraction → JNI → the C ABI.
      # A break anywhere in it shows up here as a wrong string.
      - name: The jar reports the version it was built as
        run: |
          EXPECTED="${{ needs.version.outputs.version }}"
          cat > "$RUNNER_TEMP/ReportVersion.java" <<'EOF'
          public class ReportVersion {
              public static void main(String[] args) { System.out.println(io.veridia.elysiumkv.ElysiumKV.nativeVersion()); }
          }
          EOF
          # Java 11's single-file source launcher — no build step, and it runs against the jar
          # exactly as a consumer would, extracting the platform library out of it.
          REPORTED=$(java -cp "$JAR" "$RUNNER_TEMP/ReportVersion.java")
          echo "jar version $EXPECTED, native library reports $REPORTED"
          [ "$REPORTED" = "$EXPECTED" ] || { echo "version mismatch" >&2; exit 1; }

      # The pom's central-publishing-maven-plugin runs at this phase with `waitUntil: published`, so
      # the step fails if Central rejects validation instead of returning while the release is still
      # pending.
      #
      # -DskipTests skips only *re-running* the suite that just passed; the jar is repackaged from
      # the same staging tree both gates examined, so its contents cannot differ.
      #
      # **A Central release is permanent** — a published version cannot be replaced or deleted. That
      # is why every check in this job runs before this step rather than after it.
      - name: Publish to Maven Central
        if: github.event_name == 'release'
        run: mvn -B -f bindings/java/pom.xml deploy -Prelease -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

  # The Kafka Streams adapter: pure Java, so none of the native machinery above applies to it. It
  # does need the engine at the version being released, and it gets that by building and installing
  # it here rather than resolving it from Central — a deploy that has just returned is not a
  # guarantee that the next resolve will find it, and racing a CDN is not a thing to build a release
  # on.
  #
  # **After the engine, deliberately.** Two artifacts cannot land atomically, so the order is chosen:
  # an engine without its adapter is usable, an adapter without its engine is not.
  adapter:
    name: assemble and publish the Kafka Streams adapter
    needs: [version, native, jar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_CENTRAL_GPG_PRIV_KEY }}

      - name: Collect the native libraries
        uses: actions/download-artifact@v6
        with:
          path: bindings/java/native-staging
          pattern: native-*

      - name: Arrange the staging tree
        run: |
          cd bindings/java/native-staging
          for dir in native-*; do mv "$dir" "${dir#native-}"; done

      # Installed, not resolved. The engine jar this adapter is tested and published against is the
      # one built from this checkout at this version — the same artifact the job above published.
      # Tests are skipped only because that job already ran them against this same staging tree.
      - name: Install the engine at the release version
        run: |
          mvn -B -f bindings/java/pom.xml versions:set \
            -DnewVersion="${{ needs.version.outputs.version }}" -DgenerateBackupPoms=false
          mvn -B -f bindings/java/pom.xml install -DskipTests

      # Both the adapter's own version and the engine it depends on, from the one tag that names
      # them. They are released together out of one repository, so a version skew between them
      # would mean nothing.
      - name: Set the version
        run: |
          mvn -B -f bindings/kafka-streams-v3/pom.xml versions:set \
            -DnewVersion="${{ needs.version.outputs.version }}" -DgenerateBackupPoms=false
          mvn -B -f bindings/kafka-streams-v3/pom.xml versions:set-property \
            -Dproperty=elysiumkv.version \
            -DnewVersion="${{ needs.version.outputs.version }}" -DgenerateBackupPoms=false

      # **The adapter's test suite has never run anywhere but a developer's machine until now**, and
      # running it here is worth as much as the publishing: it exercises the adapter against the
      # assembled engine jar, extracting the platform library out of it exactly as a consumer would,
      # rather than against a build directory.
      #
      # `verify` builds the sources and javadoc jars Central requires, and signs them on a release,
      # where a failure is a red check rather than a failed publish.
      - name: Build, test and sign
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            mvn -B -f bindings/kafka-streams-v3/pom.xml verify -Prelease
          else
            mvn -B -f bindings/kafka-streams-v3/pom.xml verify
          fi
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

      # The published pom must ask for a real engine version. A snapshot left in it would resolve
      # for nobody, and it is the one field `versions:set` alone would not have touched.
      - name: The built pom names the released engine
        run: |
          EXPECTED="${{ needs.version.outputs.version }}"
          POM=bindings/kafka-streams-v3/pom.xml
          RESOLVED=$(mvn -B -q -f "$POM" help:evaluate -Dexpression=elysiumkv.version -DforceStdout)
          echo "adapter depends on elysiumkv $RESOLVED"
          [ "$RESOLVED" = "$EXPECTED" ] || { echo "expected $EXPECTED" >&2; exit 1; }
          case "$RESOLVED" in *SNAPSHOT*) echo "a snapshot cannot be published" >&2; exit 1 ;; esac

      # **A Central release is permanent**, so every check above runs before this step.
      - name: Publish to Maven Central
        if: github.event_name == 'release'
        run: mvn -B -f bindings/kafka-streams-v3/pom.xml deploy -Prelease -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
